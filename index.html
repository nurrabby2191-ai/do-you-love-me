<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- প্রশ্ন অংশ -->
    <div class="question-container">
        <img src="4302.gif" alt="Asking" class="sticker">
        <h2 class="question">Do you love me?</h2>
        <div class="button-container">
            <button class="yes-btn" id="yes-btn">Yes</button>
            <button class="no-btn" id="no-btn">No</button>
        </div>
    </div>

    <!-- উত্তর অংশ ও লাভ অ্যানিমেশন -->
    <div class="result-container" id="result-container">
        <div class="cssload-main">
            <div class="cssload-heart">
                <span class="cssload-heart-1"></span>
                <span class="cssload-heart-2"></span>
                <span class="cssload-square"></span>
            </div>
            <div class="cssload-shadow"></div>
        </div>

        <img src="IMG_5909.gif" alt="Love" class="sticker">
        <h2>I knew it ! ❤️</h2>
    </div>

    <script src="script.js"></script>
</body>
</html>
